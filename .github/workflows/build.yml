name: Build

# Builds every platform + architecture combination that's actually possible
# for SegmentME, without needing to own that hardware -- see BUILDING.md for
# what build.py/docker/build.sh do on each platform; this workflow just runs
# them on GitHub-hosted runners, including the free ARM64 ones (GA for
# public repos since Aug 2025: ubuntu-24.04-arm, windows-11-arm).
#
# What's NOT built, because it isn't possible:
#   * CUDA on macOS or on ARM Windows/Linux -- no NVIDIA driver stack exists
#     there (build.py itself refuses --flavor cuda on Darwin).
#   * Windows on ARM64 -- confirmed by an actual CI run, not assumed. NumPy
#     is pinned below 2.0 (sam3 requires numpy<2), and NumPy's entire 1.x
#     series never shipped a win_arm64 wheel at all (that only arrived in
#     2.x) -- pip falls back to a from-source build, which fails outright
#     (numpy's own build predates win_arm64 support). Revisit if sam3 ever
#     supports numpy>=2.
#   * macOS on Intel (x86_64) -- not a build failure, an infrastructure one.
#     GitHub retired the macos-13 hosted runner outright on 2025-12-08, so a
#     macos-x64 job just queues forever waiting for a runner that no longer
#     exists (confirmed by an actual run: every other job finished, this one
#     never started, and the whole run had to be cancelled). GitHub has also
#     said it's dropping Intel macOS support entirely, even on newer images,
#     by Fall 2027 -- this isn't coming back. Releases are Apple Silicon
#     only; a self-hosted runner on real Intel hardware is the only way
#     around that, if it's ever needed.
#
#   * Push a tag like "v2.0.1" (matching version.py) -- builds all 6
#     combinations, then publishes them all to one GitHub Release.
#   * Actions tab -> "Build" -> "Run workflow" -- builds the same 6, left as
#     downloadable workflow artifacts (90-day retention), no release
#     published. Good for testing a change to build.py/the spec/the
#     installer script before tagging a real release.
#
# One-time repo setup the release job needs: Settings -> Actions -> General
# -> Workflow permissions -> "Read and write permissions" (off by default
# on new repos). Without it the release job fails with a 403 creating the
# release, even though every build job still succeeds.
#
# Linux builds run inside a container (docker/build.sh) so they install on
# the container's Ubuntu version+, not just whatever the runner happens to
# be on -- see BUILDING.md's "Building for older distributions". arm64
# needs a newer container (24.04, glibc 2.39) than x86_64 (22.04, glibc
# 2.35): PyQt6 6.9.0's arm64 wheel needs that newer glibc, confirmed by an
# actual CI run failing on 22.04 before docker/build.sh picked the base
# image per architecture -- see the comment in docker/Dockerfile.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  linux-x64-cpu:
    name: Linux x64 (CPU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball + .deb
        run: docker/build.sh --deb
      - uses: actions/upload-artifact@v4
        with:
          name: segmentme-linux-x64-cpu
          path: |
            dist/SegmentME-*-linux-cpu-x64.tar.gz
            dist/segmentme_*_amd64.deb
          if-no-files-found: error

  linux-x64-cuda:
    name: Linux x64 (CUDA)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball + .deb
        run: docker/build.sh --flavor cuda --deb
      - uses: actions/upload-artifact@v4
        with:
          name: segmentme-linux-x64-cuda
          path: |
            dist/SegmentME-*-linux-cuda-x64.tar.gz
            dist/segmentme-cuda_*_amd64.deb
          if-no-files-found: error

  linux-arm64-cpu:
    name: Linux ARM64 (CPU)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build tarball + .deb
        run: docker/build.sh --deb
      - uses: actions/upload-artifact@v4
        with:
          name: segmentme-linux-arm64-cpu
          path: |
            dist/SegmentME-*-linux-cpu-arm64.tar.gz
            dist/segmentme_*_arm64.deb
          if-no-files-found: error

  windows-x64-cpu:
    name: Windows x64 (CPU)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        run: python build.py --installer --no-archive
      - uses: actions/upload-artifact@v4
        with:
          name: segmentme-windows-x64-cpu
          path: dist/SegmentME-Setup-*-windows-cpu-x64.exe
          if-no-files-found: error

  windows-x64-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        run: python build.py --flavor cuda --installer --no-archive
      - uses: actions/upload-artifact@v4
        with:
          name: segmentme-windows-x64-cuda
          path: dist/SegmentME-Setup-*-windows-cuda-x64.exe
          if-no-files-found: error

  # Apple Silicon only -- see the "What's NOT built" note above for why
  # there's no Intel macOS job. build.py tags the archive with its
  # architecture (see ARCH_TAG in build.py) for consistency with the Linux/
  # Windows jobs, even though there's only one macOS architecture being
  # built.
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build.py --dmg --no-archive
      - uses: actions/upload-artifact@v4
        with:
          name: segmentme-macos-arm64
          path: dist/SegmentME-*-macos-cpu-arm64.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      [
        linux-x64-cpu,
        linux-x64-cuda,
        linux-arm64-cpu,
        windows-x64-cpu,
        windows-x64-cuda,
        macos-arm64,
      ]
    if: always() && startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect every build's output into one flat folder
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.exe" -o -name "*.dmg" \) \
            -exec cp {} release/ \;
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
