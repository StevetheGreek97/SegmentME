name: Tests
# Runs the test suite (tests/) on Windows, macOS and Linux for every push and
# pull request. The tests need no models, GPU or network beyond installing
# packages; Qt runs headless. See tests/conftest.py.
#
# Also covers the OS differences the app depends on, e.g. linking images
# into a project (hard links on Windows, symbolic links elsewhere) and
# reading scans from folders with non-English names.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ["3.12"]
        include:
          - os: ubuntu-24.04     # the oldest Python the app supports
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: PyTorch (CPU)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python -m pip install torch torchvision
          else
            python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          fi

      - name: App dependencies
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          # Same as install.sh: SAM2 from GitHub (needed by the image view and
          # the SAM2 tool); HiReS without its numpy>=2 requirement.
          SAM2_BUILD_CUDA=0 python -m pip install "https://github.com/facebookresearch/sam2/archive/refs/heads/main.zip"
          python -m pip install --no-deps "hireseg==1.2.0"
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v -p no:cacheprovider
